target-version = "py313"
line-length = 120
exclude = ["alembic/versions"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]
fixable = ["ALL"]

[lint.per-file-ignores]
"app/seed.py" = ["E501"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
